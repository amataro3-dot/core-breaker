<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>CORE BREAKER</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="core-card cyan">
      <span class="core-label">CORE</span>
      <div class="bar"><div class="fill" id="core-cyan"></div></div>
    </div>
    <div id="timer">05:00</div>
    <div class="core-card pink">
      <div class="bar"><div class="fill" id="core-pink"></div></div>
      <span class="core-label">CORE</span>
    </div>
  </header>

  <div id="minimap-wrap"><canvas id="minimap"></canvas></div>

  <main id="view">
    <canvas id="game"></canvas>
    <div id="hand"><span class="hand-icon"></span><span id="hand-count">10 / 20</span></div>
    <div id="hint">ブロックをタップ=掘る / 空きをタップ=置く</div>
    <div id="tip"></div>
    <div id="version">v0.2 ブロックの物理テスト</div>
  </main>

  <section id="controls">
    <div id="items">
      <button class="item active" type="button">銃</button>
      <button class="item soon" type="button">爆弾</button>
      <button class="item soon" type="button">つるはし</button>
      <button class="item soon" type="button">ブロック</button>
    </div>
    <div id="sticks">
      <div class="stick" id="stick-left">
        <div class="stick-base"><div class="stick-knob"></div></div>
        <span class="stick-label">移動 / ジャンプ</span>
      </div>
      <button id="dash" class="soon" type="button">DASH</button>
      <div class="stick soon" id="stick-right">
        <div class="stick-base"><div class="stick-knob"></div></div>
        <span class="stick-label">狙う / 使う</span>
      </div>
    </div>
  </section>
</div>

<div id="rotate">スマホを縦にしてね</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
