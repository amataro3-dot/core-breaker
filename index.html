<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>CORE BREAKER</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="core-card cyan">
      <span class="core-label">CORE</span>
      <div class="bar"><div class="fill" id="core-cyan"></div></div>
    </div>
    <div id="timer">05:00</div>
    <div class="core-card pink">
      <div class="bar"><div class="fill" id="core-pink"></div></div>
      <span class="core-label">CORE</span>
    </div>
  </header>

  <div id="minimap-wrap"><canvas id="minimap"></canvas></div>

  <main id="view">
    <canvas id="game"></canvas>
    <div id="hand"><span class="hand-icon"></span><span id="hand-count">10 / 20</span></div>
    <div id="hp"><span class="hp-label">HP</span><div class="hp-bar"><div id="hp-fill"></div></div><span id="hp-num">100</span></div>
    <div id="tip"></div>
    <div id="hurt"></div>
    <div id="dead"><div class="dead-title">やられた!</div><div>復活まで <span id="dead-count">5</span></div></div>
    <div id="version">v0.5 AIテスト</div>
  </main>

  <section id="controls">
    <div id="items">
      <button class="item active" type="button" data-item="gun">ピストル</button>
      <button class="item" type="button" data-item="bomb">爆弾<span class="badge" id="bomb-count">3</span></button>
      <button class="item" type="button" data-item="pick">つるはし</button>
      <button class="item" type="button" data-item="block">ブロック<span class="badge" id="block-count">10</span></button>
    </div>
    <div id="sticks">
      <div class="stick" id="stick-left">
        <div class="stick-base"><div class="stick-knob"></div></div>
        <span class="stick-label">移動 / ジャンプ</span>
      </div>
      <button id="dash" class="soon" type="button">DASH</button>
      <div class="stick" id="stick-right">
        <div class="stick-base"><div class="stick-knob"></div></div>
        <span class="stick-label">狙う / 使う</span>
      </div>
    </div>
  </section>
</div>

<div id="setup">
  <div class="setup-box">
    <div class="setup-title">CORE BREAKER</div>
    <div class="setup-sub">相手のコアを壊せ!</div>
    <div class="setup-label">人数</div>
    <div class="choice">
      <button type="button" data-size="1">1対1</button>
      <button type="button" data-size="2">2対2</button>
      <button type="button" data-size="4">4対4</button>
    </div>
    <div class="setup-label">AIの強さ</div>
    <div class="choice">
      <button type="button" data-level="weak">よわい</button>
      <button type="button" data-level="normal">ふつう</button>
      <button type="button" data-level="strong">つよい</button>
    </div>
    <div class="setup-note">自分以外はAI(コンピューター)が動かします</div>
    <button id="start" type="button">スタート</button>
  </div>
</div>

<div id="result">
  <div class="result-box">
    <div id="result-title">WIN</div>
    <div id="result-reason"></div>
    <div class="result-cores">
      <div class="rc cyan"><span>シアン</span><b id="result-cyan">1000</b></div>
      <div class="rc pink"><span>ピンク</span><b id="result-pink">1000</b></div>
    </div>
    <button id="again" type="button">もう一度</button>
    <button id="change" type="button">設定を変える</button>
  </div>
</div>

<div id="rotate">スマホを縦にしてね</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
